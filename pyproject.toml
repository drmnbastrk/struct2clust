[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "struct2clust"
dynamic = ["version"]
description = "Reproducible clustering of biomolecular structural ensembles and MD trajectories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Derman Basturk" }]
keywords = [
    "structural biology", "clustering", "HDBSCAN", "RMSD", "TM-score",
    "molecular dynamics", "conformational ensemble", "RNA", "protein",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "MDAnalysis>=2.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "diptest>=0.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/drmnbastrk/struct2clust"
Documentation = "https://github.com/drmnbastrk/struct2clust/tree/main/docs"
Issues = "https://github.com/drmnbastrk/struct2clust/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
struct2clust = "struct2clust.cli:main"

[tool.setuptools.dynamic]
version = { attr = "struct2clust.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["example/results"]   # generated viewer scripts

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["struct2clust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
