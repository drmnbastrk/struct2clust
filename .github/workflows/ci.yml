name: CI

on:
  push:
  pull_request:

jobs:
  # General matrix: current package versions on Linux and Windows, Python 3.10-3.12.
  # The regression reference test (tests/test_regression_ungrouped.py) compares exactly
  # with a reference written under the pinned versions of
  # requirements/tested-windows-py312.txt, so it is left out here and run in the
  # pinned job below (see tests/README.md).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests validation example
      - name: Test (without the platform-specific regression reference)
        run: pytest --ignore=tests/test_regression_ungrouped.py

  # Pinned job: the environment of the regression reference (Windows, Python 3.12,
  # exact package versions). Runs the whole suite, including the reference test.
  regression-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
      - name: Install pinned versions
        run: |
          python -m pip install -r requirements/tested-windows-py312.txt
          python -m pip install --no-deps -e .
      - name: Test (whole suite, including the regression reference)
        run: pytest
